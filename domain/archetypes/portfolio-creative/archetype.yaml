secciones_requeridas:
- 1. **Hero:** Nombre, tagline, foto/ilustración, CTA contacto
- 2. **Selected Work:** Grid de proyectos con hover effects
- 3. **Case Studies:** Problem → Process → Solution → Results
- 4. **About:** Story, valores, proceso de trabajo
- 5. **Contact:** Formulario, email, redes, disponibilidad
- ''
