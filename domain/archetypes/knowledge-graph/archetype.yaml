secciones_obligatorias:
- 1. **Grafo SVG interactivo:** nodo raíz (nombre + email) en el centro
- 2. **Nodos de repositorios:** TraceForge, CogniTeam, PromptForge, Asubarnipal, PopeBot-agente
- 3. **Expansión por hover:** sobre un repo se despliegan 2 nodos hijos:
-    - Conocimientos IA (categorías sujet arXiv: cs.AI, cs.LG, cs.CL, cs.MA...)
-    - README (enlace a repos/<repo>/index.html)
- 4. **Leyenda:** explica colores/significado de los nodos
- 5. **Footer:** nombre, email, enlace al perfil de GitHub
