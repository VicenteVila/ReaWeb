<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio UX Designer - Diseño de experiencias digitales centradas en el usuario.">
    <title>UX Designer Portfolio | Creative Digital Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main>
    <section id="hero">
        <div class="hero-grid">
            <h1 class="display-title">CRAFTING DIGITAL EXPERIENCES</h1>
            <div class="cta-container">
                <a href="#contact" class="btn-primary">START A PROJECT</a>
            </div>
            <div class="bg-number">01</div>
        </div>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>Transformo problemas complejos en interfaces intuitivas y estéticas.</p>
    </section>

    <section id="social_proof">
        <div class="logos"><span>Google</span><span>Airbnb</span><span>Uber</span></div>
    </section>

    <section id="testimonial">
        <blockquote>"Un trabajo excepcional, atención al detalle impecable." - Cliente Satisfecho</blockquote>
    </section>

    <section id="contact">
        <form id="contact-form">
            <input type="text" placeholder="Nombre" required>
            <input type="email" placeholder="Email" required>
            <textarea placeholder="Cuéntame sobre tu proyecto" required></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>

    <div id="graph-container"></div>
</main>

<script src="app.js" defer></script>
</body>
</html>
