identidad_del_proyecto:
- '- **Nombre:** [Nombre del producto/servicio]'
- '- **Tagline:** [Value proposition en 10 palabras máximo]'
- '- **Industria:** [SaaS, Fintech, Health, Education, etc.]'
- '- **Target:** [B2B/B2C + Perfil demográfico]'
- ''
objetivo_principal_(uno_solo):
- '- [ ] Lead generation (captar emails)'
- '- [ ] Venta directa (e-commerce)'
- '- [ ] Registro/app download'
- '- [ ] Booking/demo request'
- ''
secciones_obligatorias:
- 1. **Hero:** Headline + subheadline + CTA principal + imagen/video
- 2. **Social Proof:** Logos clientes / Testimonials / Reviews
- 3. **Beneficios:** 3-6 cards con iconos (no features, beneficios)
- 4. **How it Works:** 3 pasos máximo, visual simple
- 5. **CTA Final:** Repetir acción principal con urgency
- ''
secciones_opcionales:
- '- [ ] Pricing (si es SaaS)'
- '- [ ] FAQ (máximo 5-6 preguntas)'
- '- [ ] Team/About (si personal brand importa)'
- '- [ ] Blog preview (3 posts recientes)'
- ''
datos_requeridos:
- '- **Colores primarios:** [Hex codes]'
- '- **Tipografía:** [Google Fonts o Adobe Fonts]'
- '- **Imágenes:** [Unsplash/Custom/Generated]'
- '- **CTA Principal:** [Texto del botón]'
- '- **CTA Secundario:** [Texto alternativo]'
- ''
stack_tecnológico:
- '- Framework: Next.js 15 (App Router)'
- '- Styling: Tailwind CSS 4'
- '- Animations: Framer Motion'
- '- Forms: React Hook Form + Zod'
- '- Analytics: GA4 + GTM'
- '- Deploy: Vercel'
- ''
kpis_a_medir:
- '- Conversion rate objetivo: &gt;3%'
- '- Bounce rate objetivo: &lt;40%'
- '- Time on page: &gt;2 min'
- '- CTA clicks: Tracking por heatmap'
- ''
notas_especiales:
- '- [ ] Dark mode obligatorio'
- '- [ ] Animaciones reducidas si prefers-reduced-motion'
- '- [ ] Lighthouse: Performance &gt;90, A11y 100'
