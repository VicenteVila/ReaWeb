1._estructura_específica:
- ''
- 'CORPORATE_PAGES:'
- '- Home: Value prop, servicios destacados, CTA, trust indicators'
- '- About Us: Historia, misión/visión/valores, equipo, cultura'
- '- Services/Solutions: Detalle de ofertas, casos de éxito'
- '- Industries: Verticales específicas atendidas'
- '- Case Studies: Proyectos con clientes (resultados cuantificables)'
- '- Insights/Resources: Blog, whitepapers, webinars, reports'
- '- Careers: Oportunidades, cultura, beneficios, aplicación'
- '- Contact: Oficinas, formulario, mapa, info de ventas'
- ''
2._diseño_corporativo:
- ''
- 'CORPORATE_DESIGN:'
- '- Profesional y conservador (pero no aburrido)'
- '- Brand guidelines estrictas (colores corporativos, tipografía)'
- '- Consistencia total con materiales offline'
- '- Photography: Fotos reales de oficina/equipo (no stock genérico)'
- '- White space estructurado (no minimalista creativo, sino organizado)'
- '- Grid rígido y alineado (estabilidad y confianza)'
- '- Animaciones sutiles y profesionales (no playful)'
- ''
3._contenido_y_mensaje:
- ''
- 'CORPORATE_CONTENT:'
- '- Lenguaje: Profesional, claro, sin jerga innecesaria'
- '- Enfoque en beneficios business, no features técnicas'
- '- Data-driven: Estadísticas, números, resultados'
- '- Social proof: Logos de clientes Fortune 500 si aplica'
- '- Awards y reconocimientos de la industria'
- '- Partnerships y alianzas estratégicas'
- '- Thought leadership: Contenido que demuestre expertise'
- ''
4._confianza_y_credibilidad:
- ''
- 'TRUST_FACTORS:'
- '- Security badges y certificaciones (ISO, SOC2, etc.)'
- '- Client testimonials con nombre, cargo, empresa, foto'
- '- Case studies con ROI cuantificado'
- '- "As seen in" press mentions'
- '- Analyst reports (Gartner, Forrester) si aplica'
- '- Transparent pricing o "Contact sales" claro'
- '- GDPR/privacy compliance visible'
- ''
5._funcionalidad_específica:
- ''
- 'CORPORATE_FEATURES:'
- '- Multi-language (i18n) si es empresa global'
- '- Location finder (si múltiples oficinas)'
- '- Investor Relations section (si es pública)'
- '- Careers portal integrado (Greenhouse, Lever, o custom)'
- '- Resource center con gated content (lead generation)'
- '- Event calendar (webinars, conferences)'
- '- Chat de ventas (Drift, Intercom, o similar)'
