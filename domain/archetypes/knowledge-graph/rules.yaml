1._estructura_del_grafo:
- ''
- 'KNOWLEDGE_GRAPH_SECTIONS:'
- '- Nodo raíz: Vicente Vila + vicentevilaramirez@gmail.com (destacado, en el centro)'
- '- 8 nodos de repositorios alrededor del raíz (AgentFlow, ReaWeb, ReaGame, TraceForge, CogniTeam, PromptForge, Asubarnipal, PopeBot-agente)'
- '- Cada repo, al hacer hover, despliega 3 nodos hijos:'
- '    - Conocimientos IA: categorías sujet arXiv (cs.AI, cs.LG, cs.CL, cs.MA, cs.SE...) con explicación'
- '    - README: enlace a repos/<repo>/index.html'
- '    - Flujogramas: visualiza los diagramas Mermaid (.mmd) del repo en flujogramas/<repo>/*.mmd'
- '      renderizados con mermaid.js (mermaid.min.js local). Si el repo no tiene .mmd'
- '      (PromptForge, PopeBot-agente), muestra un aviso "Sin flujogramas disponibles".'
- '- Las aristas padre->hijo salen del BORDE SUPERIOR del nodo repo (no del centro del círculo)'
- '- Leyenda del grafo (qué significa cada color/tipo de nodo)'
- '- Footer con nombre, email y enlace a github.com/VicenteVila'
- ''
2._interacción_y_animaciones:
- ''
- 'GRAPH_INTERACTION_RULES:'
- '- Los nodos se resaltan al hacer hover: glow (drop-shadow), scale, cambio de stroke'
- '- Al hacer hover en un repo, sus 3 nodos hijos aparecen con animación de pop'
- '    (@keyframes childPopIn: opacity + scale + translate, cubic-bezier bounce) y'
- '    stagger escalonado (cada nodo con retardo ~0.1-0.15s)'
- '- Los subnodos (Conocimientos IA, README y Flujogramas) deben tener la MISMA estética que el'
- '    nodo repositorio: texto dentro del círculo (radio ≥ 32), sin etiquetas externas'
- '- Las aristas padre→hijo se dibujan (stroke-dashoffset) y se iluminan al desplegar'
- '- Las aristas padre→hijo SALEN del BORDE SUPERIOR del círculo del nodo repo'
- '    (coordenada de origen en el punto superior del círculo, no en su centro)'
- '- Los nodos hijos se ocultan de nuevo al quitar el hover'
- '- Clic en el nodo Conocimientos IA muestra el detalle de categorías (tooltip/panel)'
- '- Clic en el nodo README navega a repos/<repo>/index.html'
- '- Clic en el nodo Flujogramas abre un panel que renderiza con mermaid.js los .mmd del repo'
- '- Accesible: los nodos son <button>/<a> navegables con teclado, con aria-labels'
- ''
3._diseño_y_estética:
- ''
- 'GRAPH_DESIGN_RULES:'
- '- SVG puro (sin canvas) para el grafo'
- '- Nodo raíz: más grande, color de acento, con glow animado sutil'
- '- Nodos repos: circulares con el nombre, color por estado (hover resalta)'
- '- Nodos hijos: mismos círculos con texto DENTRO (radio ≥ 32, como el nodo repo);'
- '    texto multilínea con <tspan> si es largo ("Conocimientos IA")'
- '- Fondo con gradiente sutil y patrón de malla (grid) de nodos'
- '- Dark/light mode persistido en localStorage con prefers-color-scheme'
- '- Animaciones reducidas si prefers-reduced-motion'
- '- Sin dependencias externas ni CDN'
- ''
4._contenido_y_datos:
- ''
- 'GRAPH_DATA_RULES:'
- '- Los datos del grafo vienen de graph_data.json (generado por fetch_repo_topics)'
- '- Cada repo debe tener sus categorías sujet arXiv reales (code + description)'
- '- No inventes categorías: usa las que devuelve fetch_repo_topics'
- '- Los enlaces README deben apuntar a repos/<repo>/index.html (no a GitHub)'
- '- Los diagramas .mmd de cada repo ya están en flujogramas/<repo>/*.mmd (no los borres);'
- '    la página solo los referencia y los renderiza con mermaid.js en el navegador'
- '- mermaid.min.js está en la raíz del build (no lo borres); cárgalo con <script src="mermaid.min.js">'
- '    e inicializa con mermaid.initialize({startOnLoad:false}) y mermaid.render() al abrir un panel'
- '- Repos sin .mmd (PromptForge, PopeBot-agente): el nodo Flujogramas muestra un aviso'
- '    "Sin flujogramas disponibles para este repositorio" (no generes .mmd inventados)'
- ''

# Sistema de diseño real del arquetipo (Punto 11):
design_system:
  personalidad: técnico-editorial, exploración visual
  paleta:
    primario: '#0E7490'
    fondo_claro: '#F0FDFA'
    fondo_oscuro: '#083344'
    texto: '#134E4A'
    acento_nodos: '#84CC16'
    enlaces: '#94A3B8'
  tipografia:
    display: Instrument Sans (600-700) para títulos y etiquetas de nodos
    cuerpo: Instrument Sans (400)
    detalles: JetBrains Mono para metadatos/counts
  hero:
  - 'el grafo ES el hero: SVG a pantalla completa bajo un header fino'
  - panel lateral deslizante con detalle del nodo seleccionado
  microinteracciones:
  - 'hover en nodo: expande radio con transición y muestra tooltip con conexiones'
  - zoom con rueda + pan con drag (transform del <g> raíz, sin librerías)
  - 'leyenda interactiva: click en categoría atenúa el resto (opacity con transition)'
  - entrada animada de nodos con @keyframes stagger (scale 0→1) al cargar
  canvas: 'SVG puro mejor que canvas aquí: nodos como <circle>/<g> con listeners reales'
