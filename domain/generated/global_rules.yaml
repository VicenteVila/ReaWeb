1._arquitectura_y_estructura: []
1.1_estructura_de_carpetas_universal:
- 'REQUIRED_FOLDER_STRUCTURE:'
- /src
- /assets
- '/images          # Optimizadas, formatos modernos (webp, avif)'
- '/fonts           # Fuentes locales si es necesario'
- '/icons           # SVG preferentemente'
- /components
- '/ui              # Componentes atómicos (buttons, inputs, cards)'
- '/layout          # Layouts reutilizables (header, footer, sidebar)'
- '/sections        # Secciones de página (hero, features, cta)'
- '/hooks             # Custom React/Vue hooks'
- '/lib               # Utilidades, helpers, configuraciones'
- /styles
- '/globals.css     # Variables CSS, resets, utilidades'
- '/themes          # Temas light/dark si aplica'
- '/types             # TypeScript types/interfaces'
- '/data              # Datos estáticos, mocks, configuraciones'
- '/pages  o  /app    # Según framework (Next.js app router preferido)'
1.2_principios_de_código:
- 'CODE_PRINCIPLES:'
- '- DRY (Don''t Repeat Yourself): Crea abstracciones para patrones repetidos'
- '- KISS (Keep It Simple): Preferir soluciones simples sobre complejas'
- '- Mobile-First: Siempre diseñar para móvil primero, luego desktop'
- '- Component-Based: Todo debe ser un componente reutilizable'
- '- Type-Safe: TypeScript obligatorio, no usar ''any'''
- '- Semantic HTML: Usar etiquetas semánticas correctas (nav, main, article, etc.)'
1.3_nomenclatura_universal:
- 'NAMING_CONVENTIONS:'
- '- Componentes: PascalCase (UserProfile.tsx)'
- '- Hooks: camelCase con prefijo ''use'' (useAuth.ts)'
- '- Utilidades: camelCase (formatDate.ts)'
- '- Constantes: UPPER_SNAKE_CASE (API_ENDPOINTS)'
- '- Clases CSS: kebab-case o BEM (button--primary, card__title)'
- '- Archivos: kebab-case para no-componentes (api-client.ts)'
2._diseño_y_ux: []
2.1_sistema_de_diseño_base:
- 'DESIGN_SYSTEM_BASE:'
- '- Espaciado: Sistema de 8px base (0.5rem = 8px)'
- '- Tipografía: Máximo 3 familias de fuentes por proyecto'
- '- Colores: Definir como variables CSS en :root'
- '- Breakpoints:'
- '- sm: 640px'
- '- md: 768px'
- '- lg: 1024px'
- '- xl: 1280px'
- '- 2xl: 1536px'
- '- Z-index scale: 10-20-30-40-50 (no valores arbitrarios)'
2.2_accesibilidad_(a11y)_-_obligatorio:
- 'ACCESSIBILITY_RULES:'
- '- WCAG 2.1 AA mínimo'
- '- Contraste 4.5:1 para texto normal, 3:1 para grande'
- '- Todos los inputs deben tener labels asociados'
- '- Imágenes: alt text descriptivo, decorativas: alt=""'
- '- Navegación por teclado funcional'
- '- Focus visible en todos los elementos interactivos'
- '- ARIA labels donde el contexto no sea obvio'
2.3_performance:
- 'PERFORMANCE_RULES:'
- '- Lighthouse score mínimo: 90 en todas las categorías'
- '- Imágenes: lazy loading, formatos modernos, srcset responsive'
- '- Fuentes: font-display: swap, preconnect a dominios externos'
- '- CSS/JS: Minimizar, eliminar dead code'
- '- Core Web Vitals:'
- '- LCP &lt; 2.5s'
- '- FID &lt; 100ms'
- '- CLS &lt; 0.1'
3._seo_y_meta_datos:
- 'SEO_REQUIREMENTS:'
- '- Título único por página (&lt; 60 caracteres)'
- '- Meta description única (&lt; 160 caracteres)'
- '- Open Graph tags para compartir en redes'
- '- Canonical URLs'
- '- Sitemap.xml generado automáticamente'
- '- robots.txt configurado'
- '- Structured data (JSON-LD) para contenido relevante'
- '- URLs amigables (kebab-case, sin parámetros visibles si es posible)'
4._seguridad:
- 'SECURITY_RULES:'
- '- Nunca hardcodear secrets en el código'
- '- Sanitizar inputs de usuario'
- '- HTTPS obligatorio en producción'
- '- Content Security Policy headers'
- '- Protección contra XSS en renderizado dinámico'
- '- Validación de datos en cliente Y servidor'
5._calidad_y_testing:
- 'QUALITY_STANDARDS:'
- '- ESLint + Prettier configurados'
- '- Husky pre-commit hooks'
- '- Tests unitarios para lógica compleja'
- '- Tests de integración para flujos críticos'
- '- Testing en múltiples navegadores (Chrome, Firefox, Safari, Edge)'
- '- Responsive testing en dispositivos reales o emuladores'
6._documentación:
- 'DOCUMENTATION_RULES:'
- '- README.md en cada proyecto con:'
- '- Descripción'
- '- Stack tecnológico'
- '- Instrucciones de instalación'
- '- Estructura de carpetas'
- '- Guía de contribución'
- '- JSDoc para funciones complejas'
- '- Changelog mantenido (CHANGELOG.md)'
- '- Comentarios solo cuando el código no se explica solo'
7._control_de_versiones:
- 'GIT_WORKFLOW:'
- '- Conventional Commits (feat:, fix:, docs:, style:, refactor:, test:, chore:)'
- '- Branching: main, develop, feature/*, hotfix/*'
- '- Pull requests con code review obligatorio'
- '- .gitignore adecuado para el stack'
8._despliegue:
- 'DEPLOYMENT_RULES:'
- '- Preview deployments para cada PR'
- '- Variables de entorno configuradas en plataforma (no en repo)'
- '- Health checks configurados'
- '- Rollback strategy definida'
- '- Monitoreo de errores (Sentry o similar)'
- '- Analytics configurado (Google Analytics 4 o Plausible)'
9._comunicación_del_agente:
- 'AGENT_COMMUNICATION:'
- '- SIEMPRE explicar el "por qué" de decisiones arquitectónicas'
- '- Proponer 2-3 alternativas cuando haya decisiones importantes'
- '- Advertir sobre deuda técnica introducida'
- '- Sugerir mejoras de performance cuando se detecten cuellos de botella'
- '- Mantener un archivo DECISIONS.md con decisiones arquitectónicas importantes'
