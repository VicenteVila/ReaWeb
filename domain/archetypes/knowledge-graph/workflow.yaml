workflow: _knowledge-graph-build:
DESCRIPCIÓN: Construir una landing centrada en un grafo de conocimientos SVG interactivo.
CUÁNDO_USAR: Cuando la tarea pide un grafo de conocimientos (nodo raíz + repos + hover).
PASOS:
1. Llama a fetch_readme para generar las páginas README de cada repo (repos/<repo>/index.html).
2. Llama a fetch_repo_topics para clasificar las categorías sujet arXiv por repo
   (genera workspace/current/graph_data.json con root + repos + topics).
3. Genera H0 con generate_candidate indicando: nodo raíz (Vicente Vila + email),
   nodos repos alrededor, hover despliega 2 hijos (Conocimientos IA y README),
   efectos glow/scale en hover, SVG puro, leyenda, footer, dark/light.
4. Audita con audit_page y verifica structure (grafo, nodo raíz, readme, topics).
5. Mejora iterativamente hasta que todas las secciones estén presentes.

workflow: _knowledge-graph-optimize:
DESCRIPCIÓN: Optimizar la interactividad y estética del grafo.
CUÁNDO_USAR: Cuando el grafo existe pero faltan efectos hover o secciones.
PASOS:
1. Revisa las secciones faltantes en el estado (structure).
2. Añade/mejora: glow del nodo raíz, iluminado de aristas, transición de nodos hijos.
3. Verifica que los enlaces README apunten a repos/<repo>/index.html.
4. Re-audita.