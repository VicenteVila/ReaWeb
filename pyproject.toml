[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reaweb-harness"
version = "0.2.0"
description = "Agente ReASearch que desarrolla páginas web y evoluciona su propio harness"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "numpy<2.2",
    "faiss-cpu>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
reaweb = "scripts.reaweb_cli:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["test"]

