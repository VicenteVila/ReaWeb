1._estructura_del_grafo:
- ''
- 'KNOWLEDGE_GRAPH_SECTIONS:'
- '- Nodo raíz: Vicente Vila + vicentevilaramirez@gmail.com (destacado, en el centro)'
- '- 6 nodos de repositorios alrededor del raíz (TraceForge, CogniTeam, PromptForge, Asubarnipal, PopeBot-agente, ReaWeb)'
- '- Cada repo, al hacer hover, despliega 2 nodos hijos:'
- '    - Conocimientos IA: categorías sujet arXiv (cs.AI, cs.LG, cs.CL, cs.MA, cs.SE...) con explicación'
- '    - README: enlace a repos/<repo>/index.html'
- '- ReaWeb: además de los subnodos hover, muestra SIEMPRE 3 nodos de docs visibles'
- '    (EVOLUTION, READAPTATION, REASONING) enlazando a repos/ReaWeb/docs/<name>/index.html'
- '- Leyenda del grafo (qué significa cada color/tipo de nodo)'
- '- Footer con nombre, email y enlace a github.com/VicenteVila'
- ''
2._interacción_y_animaciones:
- ''
- 'GRAPH_INTERACTION_RULES:'
- '- Los nodos se resaltan al hacer hover: glow (drop-shadow), scale, cambio de stroke'
- '- Al hacer hover en un repo, sus 2 nodos hijos aparecen con animación de pop'
- '    (@keyframes childPopIn: opacity + scale + translate, cubic-bezier bounce) y'
- '    stagger escalonado (2º nodo con retardo ~0.15s)'
- '- Los subnodos (Conocimientos IA y README) deben tener la MISMA estética que el'
- '    nodo repositorio: texto dentro del círculo (radio ≥ 32), sin etiquetas externas'
- '- Las aristas padre→hijo se dibujan (stroke-dashoffset) y se iluminan al desplegar'
- '- Los nodos hijos se ocultan de nuevo al quitar el hover'
- '- Clic en el nodo Conocimientos IA muestra el detalle de categorías (tooltip/panel)'
- '- Clic en el nodo README navega a repos/<repo>/index.html'
- '- Accesible: los nodos son <button>/<a> navegables con teclado, con aria-labels'
- ''
3._diseño_y_estética:
- ''
- 'GRAPH_DESIGN_RULES:'
- '- SVG puro (sin canvas) para el grafo'
- '- Nodo raíz: más grande, color de acento, con glow animado sutil'
- '- Nodos repos: circulares con el nombre, color por estado (hover resalta)'
- '- Nodos hijos: mismos círculos con texto DENTRO (radio ≥ 32, como el nodo repo);'
- '    texto multilínea con <tspan> si es largo ("Conocimientos IA")'
- '- Fondo con gradiente sutil y patrón de malla (grid) de nodos'
- '- Dark/light mode persistido en localStorage con prefers-color-scheme'
- '- Animaciones reducidas si prefers-reduced-motion'
- '- Sin dependencias externas ni CDN'
- ''
4._contenido_y_datos:
- ''
- 'GRAPH_DATA_RULES:'
- '- Los datos del grafo vienen de graph_data.json (generado por fetch_repo_topics)'
- '- Cada repo debe tener sus categorías sujet arXiv reales (code + description)'
- '- No inventes categorías: usa las que devuelve fetch_repo_topics'
- '- Los enlaces README deben apuntar a repos/<repo>/index.html (no a GitHub)'
- ''