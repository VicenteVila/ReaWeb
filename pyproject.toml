[project]
name = "reaweb-harness"
version = "0.1.0"
description = "Agente ReASearch que desarrolla páginas web y evoluciona su propio harness"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
